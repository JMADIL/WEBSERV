# Two websites on different ports. Launch from the repository root.
# Port 8080 has the same routes and limits as default.conf; 8081 is static only.
# server_name is metadata: the listening endpoint selects the website.
# Sessions/cookies have no configuration directives; session integration is pending.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    client_max_body_size 10M;
    error_page 400 /error_pages/400.html;
    error_page 403 /error_pages/403.html;
    error_page 404 /error_pages/404.html;
    error_page 405 /error_pages/405.html;
    error_page 413 /error_pages/413.html;
    error_page 500 /error_pages/500.html;

    location / {
        root ./www;
        index index.html;
        allowed_methods GET;
        autoindex off;
        client_max_body_size 0;
    }
    location /uploads {
        root ./www/uploads;
        upload_path ./www/uploads;
        allowed_methods GET POST DELETE;
        autoindex on;
        client_max_body_size 10M;
    }
    location /cgi-bin {
        root ./cgi-bin;
        index test.py;
        cgi_extension .py /usr/bin/python3;
        allowed_methods GET POST;
        autoindex off;
        client_max_body_size 1M;
    }
    location /redirect {
        allowed_methods GET;
        client_max_body_size 0;
        redirect 301 /;
    }
}

server {
    listen 127.0.0.1:8081;
    server_name second.localhost;
    client_max_body_size 0;

    location / {
        root ./www-second;
        index index.html;
        allowed_methods GET;
        autoindex off;
    }
}
