# Paths are relative to the directory from which webserv is launched.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    client_max_body_size 10M;
    error_page 404 /error_pages/404.html;

    location / {
        root ./www;
        index index.html;
        allowed_methods GET;
        autoindex off;
    }
    location /uploads {
        root ./www/uploads;
        upload_path ./www/uploads;
        allowed_methods GET POST DELETE;
        autoindex on;
    }
    location /cgi-bin {
        root ./cgi-bin;
        cgi_extension .py /usr/bin/python3;
        allowed_methods GET POST;
    }
    location /redirect {
        redirect 301 /;
    }
}
